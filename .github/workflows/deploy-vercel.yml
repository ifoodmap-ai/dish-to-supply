name: Deploy Frontend to Vercel

# 同一份 codebase 部署成兩個站:
#   dish-to-supply   前台 + 餐廳後台 + 供應商後台
#   ifoodmap-admin   只有平台營運後台(靠專案上的 VITE_PORTAL=admin 環境變數分流)
# 兩個 job 平行跑,任一失敗不影響另一個。

on:
  push:
    branches:
      - main
    paths-ignore:
      - "api/**"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  # repo 的 migration 有沒有真的套到線上資料庫。
  # 2026-07-27 發現 restaurant_self_signup 躺在 repo 好幾天沒套,
  # 前端一直呼叫不存在的 RPC —— 餐廳註冊從頭到尾不可能成功,而且沒人知道。
  #
  # 刻意不擋部署:drift 存在時前端可能還有其他該修的東西要出,
  # 擋住反而綁手綁腳。這裡的目的是「讓你知道」,workflow 變紅 + GitHub 通知就夠了。
  check-migrations:
    name: 資料庫 migration 落差檢查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 比對 repo migration 與線上已套用紀錄
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::未設定 SUPABASE_ACCESS_TOKEN,跳過 migration 檢查"
            exit 0
          fi
          node scripts/check-migrations.mjs

  deploy-main:
    name: 前台 + 餐廳 + 供應商 (dish-to-supply)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DISH }}
        run: vercel deploy --prod --yes --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID

  deploy-admin:
    name: 平台營運後台 (ifoodmap-admin)
    runs-on: ubuntu-latest
    # 沒設 secret 時直接跳過,不要讓整條 workflow 變紅
    if: ${{ vars.ENABLE_ADMIN_DEPLOY != 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # VITE_PORTAL=admin 設在 Vercel 專案的環境變數上,
      # Vercel 建置時會自動帶入 —— 這裡不需要再傳一次。
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        run: vercel deploy --prod --yes --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID
