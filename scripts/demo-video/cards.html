<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>iFoodmap demo video cards</title>
<style>
  /* 這一頁不是給人看的 —— 是給 capture.py 逐張截圖當影片素材用。
     ffmpeg 這個 build 沒有 drawtext 濾鏡,所有文字都得先在瀏覽器裡排好再截成 PNG。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    /* 透明底 —— 字幕條要疊在截圖上。滿版卡片自己蓋不透明背景 */
    background: transparent;
    font-family: "Noto Sans CJK TC", "PingFang TC", "Heiti TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage { position: relative; width: 1920px; height: 1080px; }
  .card  { display: none; position: absolute; inset: 0; }
  .card.on { display: block; }

  /* ---------- 滿版卡片(開場 / 結尾) ---------- */
  /* display 只在 .on 時給,否則 .full 的 display 會蓋掉 .card 的 display:none
     (兩者同權重、.full 在後面) —— 開場跟結尾就會疊在一起 */
  .full {
    background: linear-gradient(145deg, #04241c 0%, #073b2c 45%, #041f18 100%);
    flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .full.on { display: flex; }
  /* 背景的淡淡光暈,避免整片死黑 */
  .full::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 45% at 50% 42%, rgba(5,150,105,.30), transparent 70%);
  }
  .full > * { position: relative; z-index: 1; }

  .mark {
    font-size: 26px; letter-spacing: .42em; text-transform: uppercase;
    color: #34d399; margin-bottom: 34px; font-weight: 500;
    padding-left: .42em;
  }
  .full h1 {
    font-size: 116px; font-weight: 700; color: #fff;
    letter-spacing: .04em; line-height: 1.12;
  }
  .rule {
    width: 132px; height: 5px; border-radius: 3px;
    background: #059669; margin: 40px 0 36px;
  }
  .full p {
    font-size: 40px; color: #a7f3d0; line-height: 1.66; font-weight: 400;
  }
  .url {
    margin-top: 58px; font-size: 30px; color: #6ee7b7;
    letter-spacing: .07em; font-weight: 500;
  }

  /* ---------- 字幕條(透明底,疊在畫面下方) ---------- */
  .cap {
    display: none;
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 300px;
    /* 由下往上的黑色漸層 scrim,讓白字在任何截圖上都讀得到 */
    background: linear-gradient(to top,
      rgba(2,16,12,.94) 0%, rgba(2,16,12,.86) 42%,
      rgba(2,16,12,.55) 74%, rgba(2,16,12,0) 100%);
    padding: 0 118px 62px;
    flex-direction: column; justify-content: flex-end;
  }
  .cap.on { display: flex; }

  .cap .kicker {
    display: inline-flex; align-items: center; gap: 15px;
    font-size: 25px; color: #6ee7b7; font-weight: 500;
    letter-spacing: .17em; margin-bottom: 20px;
  }
  .cap .kicker::before {
    content: ""; width: 40px; height: 4px; border-radius: 2px; background: #059669;
  }
  .cap .line {
    font-size: 60px; font-weight: 700; color: #fff;
    line-height: 1.34; letter-spacing: .015em;
    text-shadow: 0 3px 22px rgba(0,0,0,.6);
  }
  .cap .line em {
    font-style: normal; color: #6ee7b7;
  }
</style>
</head>
<body>
<div class="stage">

  <!-- 開場 -->
  <div class="card full" id="intro">
    <div class="mark">iFoodmap</div>
    <h1>食材地圖</h1>
    <div class="rule"></div>
    <p>讓餐廳與供應商<br>在同一個系統裡做生意</p>
  </div>

  <!-- 結尾:構圖刻意跟開場一致,循環回去才不會跳 -->
  <div class="card full" id="outro">
    <div class="mark">iFoodmap</div>
    <h1>食材地圖</h1>
    <div class="rule"></div>
    <p>AI 採購媒合 · 全程可追的交易紀錄</p>
    <div class="url">dish-to-supply.vercel.app</div>
  </div>

</div>

<script>
  // 字幕文案集中在這裡,改字不用動 CSS。
  // kicker = 上面那行小標(講「這是誰的畫面」),line = 主字幕。
  const CAPTIONS = [
    { id: 'cap1', kicker: '登入',       line: '餐廳、供應商<br><em>各有自己的後台</em>' },
    { id: 'cap2', kicker: '餐廳 · AI',  line: '拍一張菜單上傳<br><em>AI 自己看懂</em>' },
    { id: 'cap2b', kicker: '餐廳 · AI', line: '從菜名反推該叫的貨<br><em>連辛香料都算進去</em>' },
    { id: 'cap3', kicker: '餐廳 · 成本', line: '每道菜的食材成本與毛利<br><em>一眼看完</em>' },
    { id: 'cap4', kicker: '餐廳 · 收貨', line: '貨到現場點收<br>數量對不上<em>就回報異常</em>' },
    { id: 'cap4b', kicker: '餐廳 · 對帳', line: '逐項核對、拍照存證<br><em>短少當場留紀錄</em>' },
    { id: 'cap5', kicker: '供應商 · 商機', line: '誰在找你的品項<br><em>為什麼這張單你沒接到</em>' },
    { id: 'cap5b', kicker: '供應商 · 營運', line: '成交金額、回覆速度<br><em>一頁看完</em>' },
    { id: 'cap6', kicker: '平台 · 看板', line: '每張單卡在哪一關<br><em>該催誰,一眼看完</em>' },
    { id: 'cap6b', kicker: '平台 · 履歷', line: '誰、什麼時候、做了什麼<br><em>寫進去就不能改</em>' },
  ];

  const stage = document.querySelector('.stage');
  for (const c of CAPTIONS) {
    const el = document.createElement('div');
    el.className = 'cap';
    el.id = c.id;
    el.innerHTML = `<div class="kicker">${c.kicker}</div><div class="line">${c.line}</div>`;
    stage.appendChild(el);
  }

  // capture.py 透過 page.evaluate 呼叫這個切換要截哪一張
  window.showOnly = (id) => {
    document.querySelectorAll('.card, .cap').forEach((n) => n.classList.remove('on'));
    const el = document.getElementById(id);
    if (!el) throw new Error('no such card: ' + id);
    el.classList.add('on');
    return true;
  };

  window.CARD_IDS = ['intro', 'outro', ...CAPTIONS.map((c) => c.id)];
</script>
</body>
</html>
